services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
      - models_data:/app/ml/saved_models
      - ./Smart_Farming_dataset.csv:/app/data/Smart_Farming_dataset.csv:ro
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  models_data:
